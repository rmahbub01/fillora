<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fil-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Top Arm Gradient -->
    <linearGradient id="fil-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Vertical Spine Gradient -->
    <linearGradient id="fil-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Active Form Field Fill Gradient -->
    <linearGradient id="fil-field" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="fil-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="fil-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.38" />
    </filter>

    <!-- Ambient Glow Filter -->
    <filter id="fil-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with Glass Highlight -->
  <rect width="128" height="128" rx="28" fill="url(#fil-bg)" />
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" stroke="white" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="98" cy="26" r="30" fill="#38BDF8" opacity="0.28" filter="url(#fil-glow)" />
  <circle cx="32" cy="98" r="26" fill="#6366F1" opacity="0.32" filter="url(#fil-glow)" />

  <!-- Monogram F / Intelligent Document Mark -->
  <g filter="url(#fil-shadow)">
    <!-- Vertical Spine (Document Edge) -->
    <rect x="28" y="26" width="16" height="76" rx="8" fill="url(#fil-stem)" />

    <!-- Top Arm: Document Header & Margin with clean fold bevel -->
    <rect x="36" y="26" width="56" height="16" rx="8" fill="url(#fil-top)" />

    <!-- Document Fold Bevel at Top-Right -->
    <path d="M92 26 L80 26 C80 30.418 83.582 34 88 34 L92 34 Z" fill="#818CF8" opacity="0.55" />

    <!-- Middle Arm: Active Intelligent Form Field Bar -->
    <rect x="36" y="55" width="48" height="16" rx="8" fill="url(#fil-field)" />

    <!-- Checkmark inside the Active Field -->
    <path d="M68 63 L72.5 67.5 L80 59" stroke="#042F2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Neural AI Sparkle (Top-Right) -->
    <g transform="translate(91, 20) scale(0.95)">
      <path d="M12 0 C12 6.627 6.627 12 0 12 C6.627 12 12 17.373 12 24 C12 17.373 17.373 12 24 12 C17.373 12 12 6.627 12 0 Z" fill="url(#fil-spark)" />
      <circle cx="12" cy="12" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>