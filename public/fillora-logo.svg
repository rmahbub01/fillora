<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" fill="none">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="fl-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="fl-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <linearGradient id="fl-field" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="55%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="fl-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="fl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Tile (72x72) -->
  <g transform="translate(12, 12)">
    <rect width="72" height="72" rx="18" fill="url(#fl-bg)" />
    <rect x="0.75" y="0.75" width="70.5" height="70.5" rx="17.25" stroke="white" stroke-opacity="0.2" stroke-width="1.2" />
    
    <!-- Scaled Mark -->
    <g transform="translate(4, 4) scale(0.5)" filter="url(#fl-shadow)">
      <rect x="28" y="26" width="16" height="76" rx="8" fill="url(#fl-stem)" />
      <rect x="36" y="26" width="56" height="16" rx="8" fill="url(#fl-top)" />
      <path d="M92 26 L80 26 C80 30.418 83.582 34 88 34 L92 34 Z" fill="#818CF8" opacity="0.55" />
      <rect x="36" y="55" width="48" height="16" rx="8" fill="url(#fl-field)" />
      <path d="M68 63 L72.5 67.5 L80 59" stroke="#042F2E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <g transform="translate(91, 20) scale(0.95)">
        <path d="M12 0 C12 6.627 6.627 12 0 12 C6.627 12 12 17.373 12 24 C12 17.373 17.373 12 24 12 C17.373 12 12 6.627 12 0 Z" fill="url(#fl-spark)" />
        <circle cx="12" cy="12" r="2.5" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(102, 28)">
    <!-- Wordmark: Fillora -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.04em" fill="#0F172A">
      Fill<tspan fill="#4F46E5">ora</tspan>
    </text>

    <!-- Subtitle / Pill Badge -->
    <g transform="translate(132, 8)">
      <rect width="118" height="22" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <circle cx="12" cy="11" r="3" fill="#10B981" />
      <text x="21" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.06em" fill="#4338CA">
        AI FORM FILLER
      </text>
    </g>

    <!-- Tagline below -->
    <text x="1" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" letter-spacing="-0.01em" fill="#64748B">
      Privacy-First On-Device PDF Automation
    </text>
  </g>
</svg>